l_english:
 snd_director_category:0 "Smart Nation Director"
 snd_enable_pilot:0 "Authorize capital infrastructure pilot"
 snd_enable_pilot_desc:0 "At the next monthly check, the Director issues one order for capital infrastructure if the capital remains eligible. Construction uses the regular queue."
 snd_disable_pilot:0 "Cancel the pending pilot"
 snd_disable_pilot_desc:0 "Withdraw authorization before the monthly check. An order already issued stays in the construction queue."
 snd.1.t:0 "Capital infrastructure order issued"
 snd.1.d:0 "The Director issued its infrastructure order. Inspect the construction queue to see whether the project was accepted and how many civilian factories are assigned."
 snd.1.a:0 "Close"
 snd_open_delegation_guide:0 "Open native AI delegation guide"
 snd_open_delegation_guide_desc:0 "Shows how to delegate the country to the native AI through the console."
 snd.2.t:0 "Native AI delegation"
 snd.2.d:0 "In a non-Ironman test campaign, pause the game, open the console and enter human_ai. Wait for Human AI is now ON, then unpause. To take back control, pause and repeat the command until the console confirms that human AI is off.\n\nThe command lets the AI use the regular game systems. Keep third-party automation that uses the same queues off while testing. This decision opens the guide and leaves country control unchanged."
 snd.2.a:0 "Close"
 snd_open_national_report:0 "Open national report"
 snd_open_national_report_desc:0 "Shows industrial capacity, available manpower and the suggested priority for the country."
 snd.3.t:0 "National report"
 snd.3.d_low_stability:0 "Civilian / military factories: [?snd_report_civilian_factories|0] / [?snd_report_military_factories|0]\nDockyards: [?snd_report_dockyards|0]\nAvailable manpower (thousands): [?snd_report_manpower_k|1]\n[Root.GetSndIndustryTrend]\n[Root.GetSndConstructionStatus]\n[Root.GetSndAutoConstructionStatus]\n[Root.GetSndLastAutoProject]\n\nStability is below 50%. Review decisions that could reduce instability before making new commitments."
 snd.3.d_low_war_support:0 "Civilian / military factories: [?snd_report_civilian_factories|0] / [?snd_report_military_factories|0]\nDockyards: [?snd_report_dockyards|0]\nAvailable manpower (thousands): [?snd_report_manpower_k|1]\n[Root.GetSndIndustryTrend]\n[Root.GetSndConstructionStatus]\n[Root.GetSndAutoConstructionStatus]\n[Root.GetSndLastAutoProject]\n\nThe country is at war and war support is below 50%. Review available political decisions to sustain mobilization."
 snd.3.d_war:0 "Civilian / military factories: [?snd_report_civilian_factories|0] / [?snd_report_military_factories|0]\nDockyards: [?snd_report_dockyards|0]\nAvailable manpower (thousands): [?snd_report_manpower_k|1]\n[Root.GetSndIndustryTrend]\n[Root.GetSndConstructionStatus]\n[Root.GetSndAutoConstructionStatus]\n[Root.GetSndLastAutoProject]\n\nThe country is at war. Review equipment deficits and supply bottlenecks at the front."
 snd.3.d_peace:0 "Civilian / military factories: [?snd_report_civilian_factories|0] / [?snd_report_military_factories|0]\nDockyards: [?snd_report_dockyards|0]\nAvailable manpower (thousands): [?snd_report_manpower_k|1]\n[Root.GetSndIndustryTrend]\n[Root.GetSndConstructionStatus]\n[Root.GetSndAutoConstructionStatus]\n[Root.GetSndLastAutoProject]\n\nThe country is at peace and stability is at least 50%. Review construction and research priorities."
 snd.3.a:0 "Close"
 snd_enable_industry_tracking:0 "Start industry tracking"
 snd_enable_industry_tracking_desc:0 "Records current industrial capacity and updates the report at each month change."
 snd_disable_industry_tracking:0 "Stop industry tracking"
 snd_disable_industry_tracking_desc:0 "Stops monthly measurements. Starting again begins a new comparison."
 snd_industry_trend_off:0 "Industry tracking is off."
 snd_industry_trend_pending:0 "Waiting for the first month change after activation."
 snd_industry_trend_result:0 "Change between the last two readings (civilian / military): [?snd_civilian_factory_change|0] / [?snd_military_factory_change|0]"
 snd_set_external_construction:0 "Mark construction as externally managed"
 snd_set_external_construction_desc:0 "Suspend Director construction orders while the native AI or another mod manages the queue. Pending authorization is retained."
 snd_clear_external_construction:0 "Allow Director construction orders"
 snd_clear_external_construction_desc:0 "Use once another automation stops managing the queue. A retained authorization can run at the next eligible month change."
 snd_construction_status_external:0 "Construction: external management selected. Director orders suspended."
 snd_construction_status_available:0 "Construction: External management is off."
 snd_enable_auto_construction:0 "Enable automatic construction"
 snd_enable_auto_construction_desc:0 "The Director reviews construction each month. It prioritizes a civilian factory in peace, a military factory at war, and capital infrastructure if the preferred factory has no slot in a controlled core state. It uses the regular queue and waits at least 180 days after each order."
 snd_disable_auto_construction:0 "Disable automatic construction"
 snd_disable_auto_construction_desc:0 "Stops future automatic orders. Existing projects follow the regular construction queue."
 snd_auto_construction_off:0 "Director automatic construction is off."
 snd_auto_construction_suspended:0 "Director automatic construction is suspended by external management."
 snd_auto_construction_waiting:0 "Automatic construction is waiting for the minimum interval between orders."
 snd_auto_construction_active:0 "Automatic construction is on. The next review is at the month change."
 snd_auto_project_none:0 "The Director has yet to issue an automatic order."
 snd_auto_project_civilian:0 "Last automatic order: civilian factory in [?ROOT.snd_auto_project_state.GetName]."
 snd_auto_project_military:0 "Last automatic order: military factory in [?ROOT.snd_auto_project_state.GetName]."
 snd_auto_project_infrastructure:0 "Last automatic order: infrastructure in [?ROOT.snd_auto_project_state.GetName]."
 snd_enable_risk_alerts:0 "Enable automatic national alerts"
 snd_enable_risk_alerts_desc:0 "At each month change, opens the report when a low stability or low war support alert begins or changes. Ongoing alerts do not repeat."
 snd_disable_risk_alerts:0 "Disable automatic national alerts"
 snd_disable_risk_alerts_desc:0 "Stops opening the report automatically. You can still open it manually."

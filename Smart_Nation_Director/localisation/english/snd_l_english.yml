l_english:
 snd_director_category:0 "Smart Nation Director"
 snd_enable_pilot:0 "Authorize capital infrastructure pilot"
 snd_enable_pilot_desc:0 "At the next monthly check, the Director issues one order for capital infrastructure if the capital remains eligible. Construction uses the regular queue."
 snd_disable_pilot:0 "Cancel the pending pilot"
 snd_disable_pilot_desc:0 "Withdraw authorization before the monthly check. An order already issued stays in the construction queue."
 snd.1.t:0 "Capital infrastructure order issued"
 snd.1.d:0 "The Director issued its infrastructure order. Inspect the construction queue to see whether the project was accepted and how many civilian factories are assigned."
 snd.1.a:0 "Close"
 snd_open_delegation_guide:0 "Open native AI delegation guide"
 snd_open_delegation_guide_desc:0 "Shows how to delegate the country to the native AI through the console."
 snd.2.t:0 "Native AI delegation"
 snd.2.d:0 "In a non-Ironman test campaign, pause the game, open the console and enter human_ai. Wait for Human AI is now ON, then unpause. To take back control, pause and repeat the command until the console confirms that human AI is off.\n\nThe command lets the AI use the regular game systems. Keep third-party automation that uses the same queues off while testing. This decision opens the guide and leaves country control unchanged."
 snd.2.a:0 "Close"
 snd_open_national_report:0 "Open national report"
 snd_open_national_report_desc:0 "Shows industrial capacity, available manpower and the suggested priority for the country."
 snd.3.t:0 "National report"
 snd.3.d_low_stability:0 "Civilian / military factories: [?snd_report_civilian_factories|0] / [?snd_report_military_factories|0]\nDockyards: [?snd_report_dockyards|0]\nAvailable manpower (thousands): [?snd_report_manpower_k|1]\n[Root.GetSndIndustryTrend]\n[Root.GetSndConstructionStatus]\n[Root.GetSndTradeStatus]\n[Root.GetSndAutoConstructionStatus]\n[Root.GetSndConstructionProposal]\n[Root.GetSndLastAutoProject]\n[Root.GetSndProductionStatus]\nPolitical power: [?ROOT.political_power|0]\n[Root.GetSndDomesticPolicy]\nNative research slots (total): [?ROOT.amount_research_slots|0]\n[Root.GetSndResearchStatus]\n[Root.GetSndResearchAdvice]\n[Root.GetSndFocusAdvice]\n\nStability is below 50%. Review decisions that could reduce instability before making new commitments."
 snd.3.d_low_war_support:0 "Civilian / military factories: [?snd_report_civilian_factories|0] / [?snd_report_military_factories|0]\nDockyards: [?snd_report_dockyards|0]\nAvailable manpower (thousands): [?snd_report_manpower_k|1]\n[Root.GetSndIndustryTrend]\n[Root.GetSndConstructionStatus]\n[Root.GetSndTradeStatus]\n[Root.GetSndAutoConstructionStatus]\n[Root.GetSndConstructionProposal]\n[Root.GetSndLastAutoProject]\n[Root.GetSndProductionStatus]\nPolitical power: [?ROOT.political_power|0]\n[Root.GetSndDomesticPolicy]\nNative research slots (total): [?ROOT.amount_research_slots|0]\n[Root.GetSndResearchStatus]\n[Root.GetSndResearchAdvice]\n[Root.GetSndFocusAdvice]\n\nThe country is at war and war support is below 50%. Review available political decisions to sustain mobilization."
 snd.3.d_low_manpower:0 "Civilian / military factories: [?snd_report_civilian_factories|0] / [?snd_report_military_factories|0]\nDockyards: [?snd_report_dockyards|0]\nAvailable manpower (thousands): [?snd_report_manpower_k|1]\n[Root.GetSndIndustryTrend]\n[Root.GetSndConstructionStatus]\n[Root.GetSndTradeStatus]\n[Root.GetSndAutoConstructionStatus]\n[Root.GetSndConstructionProposal]\n[Root.GetSndLastAutoProject]\n[Root.GetSndProductionStatus]\nPolitical power: [?ROOT.political_power|0]\n[Root.GetSndDomesticPolicy]\nNative research slots (total): [?ROOT.amount_research_slots|0]\n[Root.GetSndResearchStatus]\n[Root.GetSndResearchAdvice]\n[Root.GetSndFocusAdvice]\n\nThe country is at war with fewer than 25,000 people available for mobilization. Review reinforcement needs and conscription laws before expanding the army."
 snd.3.d_low_infantry_equipment:0 "Civilian / military factories: [?snd_report_civilian_factories|0] / [?snd_report_military_factories|0]\nDockyards: [?snd_report_dockyards|0]\nAvailable manpower (thousands): [?snd_report_manpower_k|1]\n[Root.GetSndIndustryTrend]\n[Root.GetSndConstructionStatus]\n[Root.GetSndTradeStatus]\n[Root.GetSndAutoConstructionStatus]\n[Root.GetSndConstructionProposal]\n[Root.GetSndLastAutoProject]\n[Root.GetSndProductionStatus]\nPolitical power: [?ROOT.political_power|0]\n[Root.GetSndDomesticPolicy]\nNative research slots (total): [?ROOT.amount_research_slots|0]\n[Root.GetSndResearchStatus]\n[Root.GetSndResearchAdvice]\n[Root.GetSndFocusAdvice]\n\nThe country is at war with fewer than 500 infantry equipment in reserve. Review reinforcements and production in the logistics panel."
 snd.3.d_war:0 "Civilian / military factories: [?snd_report_civilian_factories|0] / [?snd_report_military_factories|0]\nDockyards: [?snd_report_dockyards|0]\nAvailable manpower (thousands): [?snd_report_manpower_k|1]\n[Root.GetSndIndustryTrend]\n[Root.GetSndConstructionStatus]\n[Root.GetSndTradeStatus]\n[Root.GetSndAutoConstructionStatus]\n[Root.GetSndConstructionProposal]\n[Root.GetSndLastAutoProject]\n[Root.GetSndProductionStatus]\nPolitical power: [?ROOT.political_power|0]\n[Root.GetSndDomesticPolicy]\nNative research slots (total): [?ROOT.amount_research_slots|0]\n[Root.GetSndResearchStatus]\n[Root.GetSndResearchAdvice]\n[Root.GetSndFocusAdvice]\n\nThe country is at war. Review equipment deficits and supply bottlenecks at the front."
 snd.3.d_peace:0 "Civilian / military factories: [?snd_report_civilian_factories|0] / [?snd_report_military_factories|0]\nDockyards: [?snd_report_dockyards|0]\nAvailable manpower (thousands): [?snd_report_manpower_k|1]\n[Root.GetSndIndustryTrend]\n[Root.GetSndConstructionStatus]\n[Root.GetSndTradeStatus]\n[Root.GetSndAutoConstructionStatus]\n[Root.GetSndConstructionProposal]\n[Root.GetSndLastAutoProject]\n[Root.GetSndProductionStatus]\nPolitical power: [?ROOT.political_power|0]\n[Root.GetSndDomesticPolicy]\nNative research slots (total): [?ROOT.amount_research_slots|0]\n[Root.GetSndResearchStatus]\n[Root.GetSndResearchAdvice]\n[Root.GetSndFocusAdvice]\n\nThe country is at peace and stability is at least 50%. Review construction and research priorities."
 snd.3.a:0 "Close"
 snd_enable_industry_tracking:0 "Start industry tracking"
 snd_enable_industry_tracking_desc:0 "Records current industrial capacity and updates the report at each month change."
 snd_disable_industry_tracking:0 "Stop industry tracking"
 snd_disable_industry_tracking_desc:0 "Stops monthly measurements. Starting again begins a new comparison."
 snd_industry_trend_off:0 "Industry tracking is off."
 snd_industry_trend_pending:0 "Waiting for the first month change after activation."
 snd_industry_trend_result:0 "Change between the last two readings (civilian / military): [?snd_civilian_factory_change|0] / [?snd_military_factory_change|0]"
 snd_set_external_construction:0 "Mark construction as externally managed"
 snd_set_external_construction_desc:0 "Suspend Director construction orders while the native AI or another mod manages the queue. Pending authorization is retained."
 snd_clear_external_construction:0 "Allow Director construction orders"
 snd_clear_external_construction_desc:0 "Use once another automation stops managing the queue. A retained authorization can run at the next eligible month change."
 snd_construction_status_external:0 "Construction: external management selected. Director orders suspended."
 snd_construction_status_available:0 "Construction: External management is off."
 snd_enable_auto_construction:0 "Enable automatic construction"
 snd_enable_auto_construction_desc:0 "The Director reviews construction each month. It prioritizes a civilian factory in peace, a military factory at war, and capital infrastructure if the preferred factory has no slot in a controlled core state. It uses the regular queue and waits at least 180 days after each order."
 snd_disable_auto_construction:0 "Disable automatic construction"
 snd_disable_auto_construction_desc:0 "Stops future automatic orders. Existing projects follow the regular construction queue."
 snd_auto_construction_off:0 "Director automatic construction is off."
 snd_auto_construction_suspended:0 "Construction planning is suspended by external management, including in advisory mode."
 snd_auto_construction_waiting:0 "Planning is waiting for the minimum 180-day interval between orders."
 snd_auto_construction_active:0 "Automatic construction is on. The next review is at the month change."
 snd_auto_project_none:0 "The Director has yet to issue an automatic order."
 snd_auto_project_civilian:0 "Last automatic order: civilian factory in [?ROOT.snd_auto_project_state.GetName]."
 snd_auto_project_military:0 "Last automatic order: military factory in [?ROOT.snd_auto_project_state.GetName]."
 snd_auto_project_infrastructure:0 "Last automatic order: infrastructure in [?ROOT.snd_auto_project_state.GetName]."
 snd_enable_risk_alerts:0 "Enable automatic national alerts"
 snd_enable_risk_alerts_desc:0 "At month change, opens a report if the highest-priority risk changes. Alerts cover surrender, stability, war support, manpower, and infantry equipment."
 snd_disable_risk_alerts:0 "Disable automatic national alerts"
 snd_disable_risk_alerts_desc:0 "Stops opening the report automatically. You can still open it manually."
 snd_start_automatic_government:0 "Start Director automatic routines"
 snd_start_automatic_government_desc:0 "Enables industry tracking and alerts. It also enables recurring construction if external management is off and no pilot is pending."
 snd_stop_automatic_government:0 "Stop Director automatic routines"
 snd_stop_automatic_government_desc:0 "Stops tracking, alerts and future recurring orders. Cancels any pending pilot. Previously issued orders remain in the queue."
 snd_release_pending_project:0 "Release planning after project cancellation"
 snd_release_pending_project_desc:0 "Use if the last automatic order was canceled or its state was lost. Releases planning while preserving the queue and the 180-day interval."
 snd_auto_construction_pending:0 "Planning is waiting for a building level increase at the previous site. Check the queue; if the order was cancelled, use the option to release the wait."
 snd_construction_status_iron_secretary:0 "Construction: Iron Secretary is configured to issue orders. The Director is waiting."
 snd_trade_status_iron_secretary:0 "Trade: Iron Secretary weekly cycle enabled."
 snd_trade_status_no_iron_secretary:0 "Trade: Iron Secretary cycle disabled or unavailable."
 snd_dash_title:0 "Smart Nation Director"
 snd_dash_factories:0 "Civilian / military factories: [?ROOT.num_of_civilian_factories|0] / [?ROOT.num_of_military_factories|0]"
 snd_dash_dockyards:0 "Dockyards: [?ROOT.num_of_naval_factories|0]"
 snd_dash_manpower:0 "Available manpower (thousands): [?ROOT.manpower_k|1]"
 snd_dash_trade:0 "[Root.GetSndTradeStatus]"
 snd_dash_report:0 "Open detailed report"
 snd_enable_rifle_production_pilot:0 "Authorize a new infantry line"
 snd_enable_rifle_production_pilot_desc:0 "The pilot creates a new line even if the same equipment is already in production. Check the production queue before authorizing. The Director may request one factory in wartime when the reserve is below 500, the technology is unlocked, and military capacity is available."
 snd_disable_rifle_production_pilot:0 "Cancel pending production pilot"
 snd_disable_rifle_production_pilot_desc:0 "Revokes the pilot authorization. An already requested line can be managed in the regular production screen."
 snd_set_external_production:0 "Mark production as externally managed"
 snd_set_external_production_desc:0 "Blocks Director production while the native AI or another mod manages military production. Retains pending authorization."
 snd_clear_external_production:0 "Allow Director production"
 snd_clear_external_production_desc:0 "Allows the pilot to check its requirements at the next month change."
 snd_production_status_external:0 "Production: external management selected."
 snd_production_status_issued:0 "Production: infantry line requested. Check the production queue."
 snd_production_status_pending:0 "Production: pilot authorized, awaiting requirements."
 snd_production_status_off:0 "Production: infantry pilot is off."
 snd_enable_construction_supervision:0 "Require approval for new construction"
 snd_enable_construction_supervision_desc:0 "Recurring construction proposes projects. You can approve or decline each proposal in the decisions menu."
 snd_disable_construction_supervision:0 "Stop requiring construction approval"
 snd_disable_construction_supervision_desc:0 "Discards the pending proposal and lets the Director dispatch eligible orders automatically at month change."
 snd_approve_construction_proposal:0 "Approve construction proposal"
 snd_approve_construction_proposal_desc:0 "[Root.GetSndConstructionProposal]\nThe project uses the regular queue. The Director rechecks its requirements."
 snd_decline_construction_proposal:0 "Decline construction proposal"
 snd_decline_construction_proposal_desc:0 "Discards the proposal and waits at least 90 days before planning another project."
 snd_proposal_none:0 "There is no construction project at the moment."
 snd_proposal_civilian:0 "[Root.GetSndConstructionPlanLabel]: civilian factory in [?ROOT.snd_proposal_state.GetName]."
 snd_proposal_military:0 "[Root.GetSndConstructionPlanLabel]: military factory in [?ROOT.snd_proposal_state.GetName]."
 snd_proposal_infrastructure:0 "[Root.GetSndConstructionPlanLabel]: infrastructure in [?ROOT.snd_proposal_state.GetName]."
 snd_enable_construction_advisory:0 "Use advisory construction mode"
 snd_enable_construction_advisory_desc:0 "With recurring construction enabled, the Director reviews its recommendation at each eligible month change and leaves the queue under your control. Changing the mode discards the pending proposal."
 snd_disable_construction_advisory:0 "Leave advisory construction mode"
 snd_disable_construction_advisory_desc:0 "Resumes automatic dispatch of eligible projects. Discards the current recommendation."
 snd_construction_advisory_active:0 "Advisory mode is on: recommendations are reviewed at eligible month changes, without dispatching construction orders."
 snd_construction_plan_advisory:0 "Latest construction recommendation"
 snd_construction_plan_proposal:0 "Construction proposal"
 snd_policy_review_conscription:0 "Review conscription laws: manpower is low and the country still uses volunteer only or limited conscription."
 snd_policy_review_mobilization:0 "Review economic laws: the country is at war and still uses a civilian economy or early mobilization."
 snd_policy_no_priority:0 "No conscription or economic review is a priority under the Director criteria."
 snd_research_status_virtual:0 "Automated Research System is enabled: the mod uses virtual slots and grants technology on completion."
 snd_research_status_native_available:0 "Automated Research System does not report activation. Check current projects in the native slots."
 snd_research_advice_infantry:0 "Consider Infantry Equipment I when reinforcements are a priority."
 snd_research_advice_industry:0 "Consider Basic Machine Tools to expand industrial capacity."
 snd_research_advice_none:0 "No priority among the technologies reviewed."
 snd_focus_coffee_completed:0 "Tracked focus: Aftermath of the Coffee Crisis is complete."
 snd_focus_coffee_progress:0 "Tracked focus: Aftermath of the Coffee Crisis has recorded progress. Check the focus tree to see whether it is selected."
 snd_focus_advice_stability:0 "For the next focus, review options that address national stability."
 snd_focus_advice_war:0 "For the next focus, review military industry and logistics options."
 snd_focus_advice_industry:0 "For the next focus, review civilian industry and research options."
 snd_open_military_report:0 "Open military report"
 snd_open_military_report_desc:0 "Shows war status, forces, and surrender progress."
 snd.4.t:0 "Military situation"
 snd.4.d_capitulated:0 "The government has capitulated.\n\nDivisions under control: [?ROOT.num_divisions|0]\nShips: [?ROOT.num_ships|0]\nWar support: [?ROOT.has_war_support|%0]"
 snd.4.d_surrender_risk:0 "The country is more than 50% of the way to surrender.\n\nDivisions under control: [?ROOT.num_divisions|0]\nShips: [?ROOT.num_ships|0]\nWar support: [?ROOT.has_war_support|%0]\nSurrender progress: [?ROOT.surrender_progress|%0]"
 snd.4.d_war:0 "The country is at war.\n\nDivisions under control: [?ROOT.num_divisions|0]\nShips: [?ROOT.num_ships|0]\nWar support: [?ROOT.has_war_support|%0]\nSurrender progress: [?ROOT.surrender_progress|%0]"
 snd.4.d_peace:0 "The country is at peace.\n\nDivisions under control: [?ROOT.num_divisions|0]\nShips: [?ROOT.num_ships|0]\nWar support: [?ROOT.has_war_support|%0]"
 snd.4.a:0 "Close"
 snd_open_diplomatic_report:0 "Open diplomatic report"
 snd_open_diplomatic_report_desc:0 "Shows your faction role and subject status."
 snd.5.t:0 "Diplomatic situation"
 snd.5.d:0 "[Root.GetSndFactionStatus]\n[Root.GetSndSubjectStatus]\n\nSubject countries: [?ROOT.num_subjects|0]"
 snd.5.a:0 "Close"
 snd_diplomacy_faction_leader:0 "Leads the faction [Root.GetFactionName]. Faction members: [?ROOT.num_faction_members|0]."
 snd_diplomacy_faction_member:0 "Belongs to the faction [Root.GetFactionName]. Faction members: [?ROOT.num_faction_members|0]."
 snd_diplomacy_no_faction:0 "Outside a faction."
 snd_diplomacy_subject:0 "The country is a subject of another country."
 snd_diplomacy_independent:0 "The country is independent."
 snd_auto_construction_pilot_waiting:0 "Planning is waiting for the infrastructure pilot to finish or be cancelled."
 snd_auto_construction_deferred:0 "Planning was deferred after a declined proposal. Review resumes after the 90-day period from the decline."
 snd_auto_construction_approval:0 "A proposal awaits your decision. Use approve or decline; approval checks the construction conditions again."
 snd_auto_construction_supervised:0 "Supervised construction is on. The next month change may generate a proposal for your approval."

l_english:
 snd_director_category:0 "Smart Nation Director"
 snd_enable_pilot:0 "Authorize capital infrastructure pilot"
 snd_enable_pilot_desc:0 "At the next monthly check, the Director issues one order for capital infrastructure if the capital remains eligible. Construction uses the regular queue."
 snd_disable_pilot:0 "Cancel the pending pilot"
 snd_disable_pilot_desc:0 "Withdraw authorization before the monthly check. An order already issued stays in the construction queue."
 snd.1.t:0 "Capital infrastructure order issued"
 snd.1.d:0 "The Director issued its infrastructure order. Inspect the construction queue to see whether the project was accepted and how many civilian factories are assigned."
 snd.1.a:0 "Close"
 snd_open_delegation_guide:0 "Open native AI delegation guide"
 snd_open_delegation_guide_desc:0 "Shows how to delegate the country to the native AI through the console."
 snd.2.t:0 "Native AI delegation"
 snd.2.d:0 "In a non-Ironman test campaign, pause the game, open the console and enter human_ai. Wait for Human AI is now ON, then unpause. To take back control, pause and repeat the command until the console confirms that human AI is off.\n\nThe command lets the AI use the regular game systems. Keep third-party automation that uses the same queues off while testing. This decision opens the guide and leaves country control unchanged."
 snd.2.a:0 "Close"
 snd_open_national_report:0 "Open national report"
 snd_open_national_report_desc:0 "Shows industrial capacity and the suggested priority for the country."
 snd.3.t:0 "National report"
 snd.3.d_low_stability:0 "Civilian / military factories: [?snd_report_civilian_factories|0] / [?snd_report_military_factories|0]\n[Root.GetSndIndustryTrend]\n[Root.GetSndConstructionStatus]\n\nStability is below 50%. Review decisions that could reduce instability before making new commitments."
 snd.3.d_war:0 "Civilian / military factories: [?snd_report_civilian_factories|0] / [?snd_report_military_factories|0]\n[Root.GetSndIndustryTrend]\n[Root.GetSndConstructionStatus]\n\nThe country is at war. Review equipment deficits and supply bottlenecks at the front."
 snd.3.d_peace:0 "Civilian / military factories: [?snd_report_civilian_factories|0] / [?snd_report_military_factories|0]\n[Root.GetSndIndustryTrend]\n[Root.GetSndConstructionStatus]\n\nThe country is at peace and stability is at least 50%. Review construction and research priorities."
 snd.3.a:0 "Close"
 snd_enable_industry_tracking:0 "Start industry tracking"
 snd_enable_industry_tracking_desc:0 "Records current industrial capacity and updates the report at each month change."
 snd_disable_industry_tracking:0 "Stop industry tracking"
 snd_disable_industry_tracking_desc:0 "Stops monthly measurements. Starting again begins a new comparison."
 snd_industry_trend_off:0 "Industry tracking is off."
 snd_industry_trend_pending:0 "Waiting for the first month change after activation."
 snd_industry_trend_result:0 "Change between the last two readings (civilian / military): [?snd_civilian_factory_change|0] / [?snd_military_factory_change|0]"
 snd_set_external_construction:0 "Mark construction as externally managed"
 snd_set_external_construction_desc:0 "Suspend Director construction orders while the native AI or another mod manages the queue. Pending authorization is retained."
 snd_clear_external_construction:0 "Allow Director construction orders"
 snd_clear_external_construction_desc:0 "Use once another automation stops managing the queue. A retained authorization can run at the next eligible month change."
 snd_construction_status_external:0 "Construction: external management selected. Director orders suspended."
 snd_construction_status_available:0 "Construction: External management is off."

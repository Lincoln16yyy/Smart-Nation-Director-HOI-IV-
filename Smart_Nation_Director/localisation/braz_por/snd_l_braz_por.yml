l_braz_por:
 snd_director_category:0 "Smart Nation Director"
 snd_enable_pilot:0 "Autorizar projeto-piloto de infraestrutura"
 snd_enable_pilot_desc:0 "Na próxima revisão mensal, o Director emitirá uma ordem de infraestrutura para a capital se ela continuar elegível. A obra usa a fila normal de construção."
 snd_disable_pilot:0 "Cancelar projeto-piloto pendente"
 snd_disable_pilot_desc:0 "Revoga a autorização antes da revisão mensal. Uma ordem já emitida permanece na fila de construção."
 snd.1.t:0 "Ordem de infraestrutura emitida"
 snd.1.d:0 "O Director emitiu a ordem de infraestrutura. Confira na fila de construção se a obra entrou e quantas fábricas civis estão alocadas."
 snd.1.a:0 "Fechar"
 snd_open_delegation_guide:0 "Consultar delegação à IA"
 snd_open_delegation_guide_desc:0 "Mostra como delegar o país à IA nativa usando o console."
 snd.2.t:0 "Delegação à IA nativa"
 snd.2.d:0 "Em uma campanha de teste fora do Ironman, pause o jogo, abra o console e digite human_ai. Aguarde a confirmação Human AI is now ON e volte a avançar o tempo. Para retomar o controle, pause e repita o comando até o console indicar que a IA foi desativada.\n\nO comando permite que a IA use os sistemas normais do jogo. Mantenha desligadas as automações de terceiros que mexem nas mesmas filas enquanto testa. Esta decisão abre o guia e não altera o controle do país."
 snd.2.a:0 "Fechar"
 snd_open_national_report:0 "Consultar situação nacional"
 snd_open_national_report_desc:0 "Mostra capacidade industrial, mão de obra disponível e a prioridade sugerida para o país."
 snd.3.t:0 "Situação nacional"
 snd.3.d_low_stability:0 "Fábricas civis / militares: [?snd_report_civilian_factories|0] / [?snd_report_military_factories|0]\nEstaleiros: [?snd_report_dockyards|0]\nMão de obra disponível (milhares): [?snd_report_manpower_k|1]\n[Root.GetSndIndustryTrend]\n[Root.GetSndConstructionStatus]\n[Root.GetSndTradeStatus]\n[Root.GetSndAutoConstructionStatus]\n[Root.GetSndConstructionProposal]\n[Root.GetSndLastAutoProject]\n[Root.GetSndProductionStatus]\nPoder político: [?ROOT.political_power|0]\n[Root.GetSndDomesticPolicy]\nSlots nativos de pesquisa (total): [?ROOT.amount_research_slots|0]\n[Root.GetSndResearchStatus]\n[Root.GetSndResearchAdvice]\n[Root.GetSndFocusAdvice]\n\nA estabilidade está abaixo de 50%. Avalie decisões que reduzam a instabilidade antes de assumir novos compromissos."
 snd.3.d_low_war_support:0 "Fábricas civis / militares: [?snd_report_civilian_factories|0] / [?snd_report_military_factories|0]\nEstaleiros: [?snd_report_dockyards|0]\nMão de obra disponível (milhares): [?snd_report_manpower_k|1]\n[Root.GetSndIndustryTrend]\n[Root.GetSndConstructionStatus]\n[Root.GetSndTradeStatus]\n[Root.GetSndAutoConstructionStatus]\n[Root.GetSndConstructionProposal]\n[Root.GetSndLastAutoProject]\n[Root.GetSndProductionStatus]\nPoder político: [?ROOT.political_power|0]\n[Root.GetSndDomesticPolicy]\nSlots nativos de pesquisa (total): [?ROOT.amount_research_slots|0]\n[Root.GetSndResearchStatus]\n[Root.GetSndResearchAdvice]\n[Root.GetSndFocusAdvice]\n\nO país está em guerra e o apoio à guerra está abaixo de 50%. Confira as opções políticas disponíveis para sustentar a mobilização."
 snd.3.d_low_manpower:0 "Fábricas civis / militares: [?snd_report_civilian_factories|0] / [?snd_report_military_factories|0]\nEstaleiros: [?snd_report_dockyards|0]\nMão de obra disponível (milhares): [?snd_report_manpower_k|1]\n[Root.GetSndIndustryTrend]\n[Root.GetSndConstructionStatus]\n[Root.GetSndTradeStatus]\n[Root.GetSndAutoConstructionStatus]\n[Root.GetSndConstructionProposal]\n[Root.GetSndLastAutoProject]\n[Root.GetSndProductionStatus]\nPoder político: [?ROOT.political_power|0]\n[Root.GetSndDomesticPolicy]\nSlots nativos de pesquisa (total): [?ROOT.amount_research_slots|0]\n[Root.GetSndResearchStatus]\n[Root.GetSndResearchAdvice]\n[Root.GetSndFocusAdvice]\n\nO país está em guerra e tem menos de 25 mil pessoas disponíveis para mobilização. Confira as necessidades de reforço e as leis de recrutamento antes de expandir o exército."
 snd.3.d_low_infantry_equipment:0 "Fábricas civis / militares: [?snd_report_civilian_factories|0] / [?snd_report_military_factories|0]\nEstaleiros: [?snd_report_dockyards|0]\nMão de obra disponível (milhares): [?snd_report_manpower_k|1]\n[Root.GetSndIndustryTrend]\n[Root.GetSndConstructionStatus]\n[Root.GetSndTradeStatus]\n[Root.GetSndAutoConstructionStatus]\n[Root.GetSndConstructionProposal]\n[Root.GetSndLastAutoProject]\n[Root.GetSndProductionStatus]\nPoder político: [?ROOT.political_power|0]\n[Root.GetSndDomesticPolicy]\nSlots nativos de pesquisa (total): [?ROOT.amount_research_slots|0]\n[Root.GetSndResearchStatus]\n[Root.GetSndResearchAdvice]\n[Root.GetSndFocusAdvice]\n\nO país está em guerra e tem menos de 500 equipamentos de infantaria em reserva. Confira reforços e produção no painel de logística."
 snd.3.d_war:0 "Fábricas civis / militares: [?snd_report_civilian_factories|0] / [?snd_report_military_factories|0]\nEstaleiros: [?snd_report_dockyards|0]\nMão de obra disponível (milhares): [?snd_report_manpower_k|1]\n[Root.GetSndIndustryTrend]\n[Root.GetSndConstructionStatus]\n[Root.GetSndTradeStatus]\n[Root.GetSndAutoConstructionStatus]\n[Root.GetSndConstructionProposal]\n[Root.GetSndLastAutoProject]\n[Root.GetSndProductionStatus]\nPoder político: [?ROOT.political_power|0]\n[Root.GetSndDomesticPolicy]\nSlots nativos de pesquisa (total): [?ROOT.amount_research_slots|0]\n[Root.GetSndResearchStatus]\n[Root.GetSndResearchAdvice]\n[Root.GetSndFocusAdvice]\n\nO país está em guerra. Verifique os déficits de equipamento e os gargalos de suprimento das frentes."
 snd.3.d_peace:0 "Fábricas civis / militares: [?snd_report_civilian_factories|0] / [?snd_report_military_factories|0]\nEstaleiros: [?snd_report_dockyards|0]\nMão de obra disponível (milhares): [?snd_report_manpower_k|1]\n[Root.GetSndIndustryTrend]\n[Root.GetSndConstructionStatus]\n[Root.GetSndTradeStatus]\n[Root.GetSndAutoConstructionStatus]\n[Root.GetSndConstructionProposal]\n[Root.GetSndLastAutoProject]\n[Root.GetSndProductionStatus]\nPoder político: [?ROOT.political_power|0]\n[Root.GetSndDomesticPolicy]\nSlots nativos de pesquisa (total): [?ROOT.amount_research_slots|0]\n[Root.GetSndResearchStatus]\n[Root.GetSndResearchAdvice]\n[Root.GetSndFocusAdvice]\n\nO país está em paz e a estabilidade é de pelo menos 50%. Compare as prioridades de construção e pesquisa."
 snd.3.a:0 "Fechar"
 snd_enable_industry_tracking:0 "Ativar acompanhamento industrial"
 snd_enable_industry_tracking_desc:0 "Registra a capacidade industrial agora e atualiza o relatório a cada virada de mês."
 snd_disable_industry_tracking:0 "Desativar acompanhamento industrial"
 snd_disable_industry_tracking_desc:0 "Interrompe as medições mensais. Reativar inicia uma nova comparação."
 snd_industry_trend_off:0 "Acompanhamento industrial desativado."
 snd_industry_trend_pending:0 "Aguardando a primeira virada de mês desde a ativação."
 snd_industry_trend_result:0 "Variação entre as duas últimas medições (civis / militares): [?snd_civilian_factory_change|0] / [?snd_military_factory_change|0]"
 snd_set_external_construction:0 "Indicar construção gerida externamente"
 snd_set_external_construction_desc:0 "Suspenda as ordens do Director enquanto a IA nativa ou outro mod cuida da fila. Uma autorização pendente fica guardada."
 snd_clear_external_construction:0 "Liberar construção para o Director"
 snd_clear_external_construction_desc:0 "Use quando a outra automação deixar de cuidar da fila. Uma autorização guardada poderá ser executada na próxima virada elegível."
 snd_construction_status_external:0 "Construção: gestão externa indicada. Ordens do Director suspensas."
 snd_construction_status_available:0 "Construção: gestão externa desmarcada."
 snd_enable_auto_construction:0 "Ativar construção automática"
 snd_enable_auto_construction_desc:0 "O Director avalia a construção na virada do mês. Prioriza fábrica civil em paz, militar em guerra e infraestrutura na capital se a fábrica preferida não couber em um estado central controlado. Usa a fila normal e espera pelo menos 180 dias após cada ordem."
 snd_disable_auto_construction:0 "Desativar construção automática"
 snd_disable_auto_construction_desc:0 "Interrompe novas ordens automáticas. Obras já emitidas continuam sob as regras da fila normal."
 snd_auto_construction_off:0 "Construção automática do Director desativada."
 snd_auto_construction_suspended:0 "Planejamento de construção suspenso por gestão externa, inclusive no modo consultivo."
 snd_auto_construction_waiting:0 "Planejamento aguardando o intervalo mínimo de 180 dias entre ordens."
 snd_auto_construction_active:0 "Construção automática ativa. Nova avaliação na próxima virada."
 snd_auto_project_none:0 "O Director ainda não emitiu ordens automáticas."
 snd_auto_project_civilian:0 "Última ordem automática: fábrica civil em [?ROOT.snd_auto_project_state.GetName]."
 snd_auto_project_military:0 "Última ordem automática: fábrica militar em [?ROOT.snd_auto_project_state.GetName]."
 snd_auto_project_infrastructure:0 "Última ordem automática: infraestrutura em [?ROOT.snd_auto_project_state.GetName]."
 snd_enable_risk_alerts:0 "Ativar alertas nacionais automáticos"
 snd_enable_risk_alerts_desc:0 "Na virada do mês, abre o relatório se a prioridade de risco mudar. Os alertas cobrem capitulação, estabilidade, apoio à guerra, mão de obra e equipamento de infantaria."
 snd_disable_risk_alerts:0 "Desativar alertas nacionais automáticos"
 snd_disable_risk_alerts_desc:0 "Interrompe a abertura automática do relatório. A consulta manual continua disponível."
 snd_start_automatic_government:0 "Iniciar rotinas automáticas do Director"
 snd_start_automatic_government_desc:0 "Liga acompanhamento industrial e alertas. Também liga a construção recorrente se a fila não estiver sob gestão externa e não houver um piloto pendente."
 snd_stop_automatic_government:0 "Parar rotinas automáticas do Director"
 snd_stop_automatic_government_desc:0 "Desliga acompanhamento, alertas e novas ordens recorrentes. Cancela um piloto ainda pendente. Obras já enviadas continuam na fila."
 snd_release_pending_project:0 "Liberar planejamento após obra cancelada"
 snd_release_pending_project_desc:0 "Use se a última obra automática foi cancelada ou o estado foi perdido. Libera o planejamento sem alterar a fila nem o intervalo de 180 dias."
 snd_auto_construction_pending:0 "Planejamento aguardando aumento do nível da obra anterior. Confira a fila; se a obra foi cancelada, use a opção de liberar a espera."
 snd_construction_status_iron_secretary:0 "Construção: Iron Secretary está configurado para emitir ordens. O Director aguarda."
 snd_trade_status_iron_secretary:0 "Comércio: ciclo semanal do Iron Secretary habilitado."
 snd_trade_status_no_iron_secretary:0 "Comércio: ciclo do Iron Secretary desativado ou indisponível."
 snd_dash_title:0 "Smart Nation Director"
 snd_dash_factories:0 "Fábricas civis / militares: [?ROOT.num_of_civilian_factories|0] / [?ROOT.num_of_military_factories|0]"
 snd_dash_dockyards:0 "Estaleiros: [?ROOT.num_of_naval_factories|0]"
 snd_dash_manpower:0 "Mão de obra disponível (milhares): [?ROOT.manpower_k|1]"
 snd_dash_trade:0 "[Root.GetSndTradeStatus]"
 snd_dash_report:0 "Abrir relatório detalhado"
 snd_enable_rifle_production_pilot:0 "Autorizar nova linha de infantaria"
 snd_enable_rifle_production_pilot_desc:0 "O piloto abre uma linha nova mesmo se já houver outra do mesmo equipamento. Confira a fila antes de autorizar. O Director pode solicitar uma fábrica em guerra, com reserva abaixo de 500, tecnologia liberada e capacidade militar disponível."
 snd_disable_rifle_production_pilot:0 "Cancelar piloto de produção pendente"
 snd_disable_rifle_production_pilot_desc:0 "Revoga a autorização do piloto. Uma linha já solicitada pode ser gerida na produção normal."
 snd_set_external_production:0 "Indicar produção gerida externamente"
 snd_set_external_production_desc:0 "Bloqueia a produção do Director enquanto a IA nativa ou outro mod administra a produção militar. Preserva uma autorização pendente."
 snd_clear_external_production:0 "Liberar produção para o Director"
 snd_clear_external_production_desc:0 "Permite que o piloto volte a avaliar os requisitos na próxima virada de mês."
 snd_production_status_external:0 "Produção: gestão externa indicada."
 snd_production_status_issued:0 "Produção: linha de infantaria solicitada. Confira a fila de produção."
 snd_production_status_pending:0 "Produção: piloto autorizado, aguardando os requisitos."
 snd_production_status_off:0 "Produção: piloto de infantaria desativado."
 snd_enable_construction_supervision:0 "Exigir aprovação para novas obras"
 snd_enable_construction_supervision_desc:0 "A construção recorrente passa a sugerir obras. Você pode aprovar ou recusar cada proposta pelo menu."
 snd_disable_construction_supervision:0 "Dispensar aprovação de obras"
 snd_disable_construction_supervision_desc:0 "Descarta a proposta pendente e deixa o Director voltar a despachar ordens elegíveis nas viradas de mês."
 snd_approve_construction_proposal:0 "Aprovar proposta de construção"
 snd_approve_construction_proposal_desc:0 "[Root.GetSndConstructionProposal]\nA obra usa a fila normal. O Director confere novamente as condições."
 snd_decline_construction_proposal:0 "Recusar proposta de construção"
 snd_decline_construction_proposal_desc:0 "Descarta a proposta e espera pelo menos 90 dias antes de planejar outra obra."
 snd_proposal_none:0 "Nenhum projeto de construção no momento."
 snd_proposal_civilian:0 "[Root.GetSndConstructionPlanLabel]: fábrica civil em [?ROOT.snd_proposal_state.GetName]."
 snd_proposal_military:0 "[Root.GetSndConstructionPlanLabel]: fábrica militar em [?ROOT.snd_proposal_state.GetName]."
 snd_proposal_infrastructure:0 "[Root.GetSndConstructionPlanLabel]: infraestrutura em [?ROOT.snd_proposal_state.GetName]."
 snd_enable_construction_advisory:0 "Usar modo consultivo na construção"
 snd_enable_construction_advisory_desc:0 "Com a construção recorrente ligada, o Director revisa a recomendação a cada virada elegível e deixa a fila sob seu controle. Trocar de modo descarta a proposta pendente."
 snd_disable_construction_advisory:0 "Sair do modo consultivo de construção"
 snd_disable_construction_advisory_desc:0 "Volta ao despacho automático de obras elegíveis. A recomendação atual será descartada."
 snd_construction_advisory_active:0 "Modo consultivo ativo: recomendações revistas nas viradas elegíveis, sem enviar ordens de construção."
 snd_construction_plan_advisory:0 "Última recomendação de construção"
 snd_construction_plan_proposal:0 "Proposta de construção"
 snd_policy_review_conscription:0 "Reveja as leis de recrutamento: a reserva de mão de obra está baixa, e o país ainda usa voluntariado ou recrutamento limitado."
 snd_policy_review_mobilization:0 "Reveja as leis econômicas: o país está em guerra e ainda usa economia civil ou mobilização inicial."
 snd_policy_no_priority:0 "Nenhuma revisão de recrutamento ou economia é prioritária pelos critérios do Director."
 snd_research_status_virtual:0 "Automated Research System ativo: o mod usa slots virtuais e entrega tecnologias ao final."
 snd_research_status_native_available:0 "Automated Research System sem sinal de ativação. Confira os projetos nos slots nativos."
 snd_research_advice_infantry:0 "Considere Equipamento de Infantaria I quando os reforços forem prioridade."
 snd_research_advice_industry:0 "Considere Ferramentas de Usinagem Básicas para ampliar a capacidade da indústria."
 snd_research_advice_none:0 "Nenhuma prioridade entre as tecnologias avaliadas."
 snd_focus_coffee_completed:0 "Foco acompanhado: Consequências da crise do café foi concluído."
 snd_focus_coffee_progress:0 "Foco acompanhado: Consequências da crise do café tem progresso registrado. Confira se está selecionado na árvore."
 snd_focus_advice_stability:0 "Para o próximo foco, examine as opções que tratam da estabilidade nacional."
 snd_focus_advice_war:0 "Para o próximo foco, examine as opções de indústria militar e logística."
 snd_focus_advice_industry:0 "Para o próximo foco, examine as opções de indústria civil e pesquisa."
 snd_open_military_report:0 "Consultar situação militar"
 snd_open_military_report_desc:0 "Mostra o estado de guerra, as forças e o progresso de capitulação."

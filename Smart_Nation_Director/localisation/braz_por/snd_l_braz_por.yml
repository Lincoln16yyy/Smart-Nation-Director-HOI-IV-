l_braz_por:
 snd_director_category:0 "Smart Nation Director"
 snd_enable_pilot:0 "Autorizar projeto-piloto de infraestrutura"
 snd_enable_pilot_desc:0 "Na próxima revisão mensal, o Director emitirá uma ordem de infraestrutura para a capital se ela continuar elegível. A obra usa a fila normal de construção."
 snd_disable_pilot:0 "Cancelar projeto-piloto pendente"
 snd_disable_pilot_desc:0 "Revoga a autorização antes da revisão mensal. Uma ordem já emitida permanece na fila de construção."
 snd.1.t:0 "Ordem de infraestrutura emitida"
 snd.1.d:0 "O Director emitiu a ordem de infraestrutura. Confira na fila de construção se a obra entrou e quantas fábricas civis estão alocadas."
 snd.1.a:0 "Fechar"
 snd_open_delegation_guide:0 "Consultar delegação à IA"
 snd_open_delegation_guide_desc:0 "Mostra como delegar o país à IA nativa usando o console."
 snd.2.t:0 "Delegação à IA nativa"
 snd.2.d:0 "Em uma campanha de teste fora do Ironman, pause o jogo, abra o console e digite human_ai. Aguarde a confirmação Human AI is now ON e volte a avançar o tempo. Para retomar o controle, pause e repita o comando até o console indicar que a IA foi desativada.\n\nO comando permite que a IA use os sistemas normais do jogo. Mantenha desligadas as automações de terceiros que mexem nas mesmas filas enquanto testa. Esta decisão abre o guia e não altera o controle do país."
 snd.2.a:0 "Fechar"
 snd_open_national_report:0 "Consultar situação nacional"
 snd_open_national_report_desc:0 "Mostra a capacidade industrial e a prioridade sugerida para o país."
 snd.3.t:0 "Situação nacional"
 snd.3.d_low_stability:0 "Fábricas civis / militares: [?snd_report_civilian_factories|0] / [?snd_report_military_factories|0]\n[Root.GetSndIndustryTrend]\n[Root.GetSndConstructionStatus]\n\nA estabilidade está abaixo de 50%. Avalie decisões que reduzam a instabilidade antes de assumir novos compromissos."
 snd.3.d_war:0 "Fábricas civis / militares: [?snd_report_civilian_factories|0] / [?snd_report_military_factories|0]\n[Root.GetSndIndustryTrend]\n[Root.GetSndConstructionStatus]\n\nO país está em guerra. Verifique os déficits de equipamento e os gargalos de suprimento das frentes."
 snd.3.d_peace:0 "Fábricas civis / militares: [?snd_report_civilian_factories|0] / [?snd_report_military_factories|0]\n[Root.GetSndIndustryTrend]\n[Root.GetSndConstructionStatus]\n\nO país está em paz e a estabilidade é de pelo menos 50%. Compare as prioridades de construção e pesquisa."
 snd.3.a:0 "Fechar"
 snd_enable_industry_tracking:0 "Ativar acompanhamento industrial"
 snd_enable_industry_tracking_desc:0 "Registra a capacidade industrial agora e atualiza o relatório a cada virada de mês."
 snd_disable_industry_tracking:0 "Desativar acompanhamento industrial"
 snd_disable_industry_tracking_desc:0 "Interrompe as medições mensais. Reativar inicia uma nova comparação."
 snd_industry_trend_off:0 "Acompanhamento industrial desativado."
 snd_industry_trend_pending:0 "Aguardando a primeira virada de mês desde a ativação."
 snd_industry_trend_result:0 "Variação entre as duas últimas medições (civis / militares): [?snd_civilian_factory_change|0] / [?snd_military_factory_change|0]"
 snd_set_external_construction:0 "Indicar construção gerida externamente"
 snd_set_external_construction_desc:0 "Suspenda as ordens do Director enquanto a IA nativa ou outro mod cuida da fila. Uma autorização pendente fica guardada."
 snd_clear_external_construction:0 "Liberar construção para o Director"
 snd_clear_external_construction_desc:0 "Use quando a outra automação deixar de cuidar da fila. Uma autorização guardada poderá ser executada na próxima virada elegível."
 snd_construction_status_external:0 "Construção: gestão externa indicada. Ordens do Director suspensas."
 snd_construction_status_available:0 "Construção: gestão externa desmarcada."
